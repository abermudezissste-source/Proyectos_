<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expediente Electrónico — EBDI</title>
  

  <style>
    :root{
      --bg:#f7f9fb;
      --card:#ffffff;
      --text:#1f2d3d;
      --muted:#6b7280;
      --primary:#2563eb;
      --secondary:#eef2ff;
      --border:#e5e7eb;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      padding:24px;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      background:var(--bg);
      color:var(--text)
    }
    h1{font-size:1.6rem;margin:0 0 4px 0}
    h2{font-size:1.2rem;margin:20px 0 10px 0}
    .container{max-width:1000px;margin:0 auto}
    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:10px;
      padding:20px;
      margin-bottom:18px;
      box-shadow:0 1px 2px rgba(0,0,0,.04)
    }
    .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
    .col-12{grid-column:span 12}
    .col-6{grid-column:span 6}
    .col-4{grid-column:span 4}
    .col-8{grid-column:span 8}
    label{display:block;font-size:.85rem;color:var(--muted);margin:6px 0}
    input, select, textarea{
      width:100%;
      padding:10px;
      border:1px solid var(--border);
      border-radius:8px
    }
    textarea{min-height:120px}
    .muted{color:var(--muted);font-size:.85rem}
    .actions{
      display:flex;
      justify-content:flex-end;
      gap:10px;
      margin-top:12px
    }
    button{
      padding:10px 16px;
      border-radius:8px;
      border:none;
      background:var(--primary);
      color:#fff;
      cursor:pointer
    }
    button.secondary{
      background:var(--secondary);
      color:#1e40af
    }
    @media (max-width:800px){
      .col-6,.col-4,.col-8{grid-column:span 12}
    }
  </style>
</head>

<script src="xlsx.full.min.js"></script>
<script src="js/expediente.js"></script>
<body>

<div class="container">

  <!-- ================= ENCABEZADO ================= -->
  <header class="card">
    <h1 id="tituloExpediente">Expediente Electrónico</h1>
    <div class="muted">
      <strong>Matrícula:</strong> <span id="Matricula">—</span> |
      <strong>EBDI:</strong> <span id="EBDI">—</span>
    </div>
    
<button type="button" class="secondary" id="btnVolver">
  ← Volver a Matrículas
</button>

  </header>

  <!-- ================= FORMULARIO ================= -->
  <form id="expedienteForm" class="card" onsubmit="return false;">

    <!-- Identidad -->
    <h2>Datos de identidad</h2>
    <div class="grid">
      <div class="col-6">
        <label>Matrícula</label>
        <input name="matriculaId" readonly>
      </div>
      <div class="col-6">
        <label>Estado</label>
        <input name="EstadoId" readonly>
      </div>
      <div class="col-6">
        <label>EBDI</label>
        <input name="ebdiId" readonly>
      </div>
      <div class="col-6">
        <label>Estrato</label>
       <input name="estrato">
      </div>
      <div class="col-6">
        <label>CURP</label>
        <input name="curp">
      </div>
      <div class="col-6">
        <label>Nombres</label>
        <input name="nombres">
      </div>
      <div class="col-6">
        <label>Apellido paterno</label>
        <input name="ap_paterno">
      </div>
      <div class="col-6">
        <label>Apellido materno</label>
        <input name="ap_materno">
      </div>
      <div class="col-6">
        <label>Género</label>
        <select name="genero">
          <option value="">Seleccione…</option>
          <option>Femenino</option>
          <option>Masculino</option>
        </select>
      </div>
    </div>

    <!-- Contacto -->
    <h2>Datos de contacto</h2>
    <div class="grid">
      <div class="col-6"><label>Teléfono</label><input name="telefono"></div>
      <div class="col-6"><label>Whatsapp</label><input name="whatsapp"></div>
      <div class="col-12"><label>Correo electrónico</label><input name="correo"></div>
      <div class="col-12"><label>Dirección</label><input name="direccion"></div>
    </div>

    <!-- Antecedentes -->
    <h2>Antecedentes médicos</h2>
    <label>Antecedentes personales patológicos</label>
    <textarea name="ant_personales_patologicos"></textarea>

    <label>Antecedentes no patológicos</label>
    <textarea name="ant_personales_no_patologicos"></textarea>

    <label>Alergias</label>
    <textarea name="alergias"></textarea>

    <!-- Observaciones -->
    <h2>Observaciones clínicas</h2>
    <textarea name="observaciones"></textarea>

    <!-- Acciones -->
    <div class="actions">
      <button type="button" class="secondary" id="btnLimpiar">Limpiar</button>
      <button type="button" id="btnGuardar">Guardar expediente</button>
    </div>

  </form>

  <p class="muted">Proyecto Expediente Electrónico EBDI — Versión base normalizada</p>

</div>

<script>
  // Limpieza de formulario
  const btnLimpiar = document.getElementById("btnLimpiar");
  if (btnLimpiar) {
    btnLimpiar.addEventListener("click", () => {
      document.getElementById("expedienteForm").reset();
    });
  }
</script>


</body>
</html>
