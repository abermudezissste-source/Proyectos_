<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />

<script>
const usuario = localStorage.getItem("usuario");

if (!usuario) {
    window.location.href = "login.html";
}
</script>

<title>Dashboard EBDI</title>
<link rel="stylesheet" href="css/styles.css" />
<style>
  body {
    font-family: "Segoe UI", Arial, sans-serif;
  }
</style>
</head>

<!-- Modal de estado -->
<div id="estadoModal" class="modal">
  <div class="modal-content">
    <h3 id="modalTitulo">Estado seleccionado</h3>
    <p id="modalTexto"></p>

    <div class="modal-buttons">
      <button id="btnAceptar">Aceptar</button>
      <button id="btnDetalle">Ver detalle</button>
    </div>
  </div>
</div>

<!-- Tooltip para los Estados -->
<div id="tooltipEstado" class="tooltip"></div>

<script> 
function abrirDashboard(estadoId) {
  window.location.href = `matricula.html?estado=${estadoId}`
}
</script>

<body>
<!-- HEADER -->
<header class="header">
  <div class="header-left">
    <img src="img/logo.png" alt="Logo" class="logo">
    <h1 class="titulo">Dashboard Matrículas - EBDI</h1>
  </div>
</header>
<div id="sesion">
  Usuario: <span id="usuarioLogeado"></span>
  <button onclick="logout()">Cerrar sesión</button>
</div>

<!-- CONTENIDO -->
<main class="main">
  <div id="map-container">
    <object id="mapa" type="image/svg+xml" data="MapaIndex.svg"></object>
  </div>

  <div id="contador"></div>
  <div id="ebdiContainer"></div>
  <div id="pagination"></div>
</main>


<!-- FOOTER -->
<footer class="footer">
  <p>Sistema Crecimiento y Desarrollo EBDI © 2026 | Subdirección de Capacitación y Servicios Educativos</p>
</footer>

<!-- Scripts -->
<script src="js/app.js"></script>

<script>
// Obtener usuario
const usuarioLog = localStorage.getItem("usuario");

// Mostrar usuario en pantalla
if (usuarioLog) {
    document.getElementById("usuarioLogeado").textContent = usuarioLog;
}

// Función cerrar sesión
function logout() {
    localStorage.clear();
    window.location.href = "login.html";
}
<div id="sesion" style="position:absolute; top:10px; right:20px;">
  Usuario: <span id="usuarioLogeado"></span>
  <button onclick="logout()">Cerrar sesión</button>
</div>
</script>
<div id="sesion">
  Usuario: <span id="usuarioLogeado"></span> |
  Rol: <span id="rolLogeado"></span>
  <button onclick="logout()">Cerrar sesión</button>
</div>
</body>
</html>
