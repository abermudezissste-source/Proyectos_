<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Dashboard EBDI</title>
<link rel="stylesheet" href="css/styles.css" />
<style>  
body {
    opacity: 0;
    transition: opacity 0.5s ease-in-out;
}

body.loaded {
    opacity: 1;
}
body {
    font-family: "Segoe UI", Arial, sans-serif;
  }
</style>
</head>

<!-- Modal de estado -->
<div id="estadoModal" class="modal">
  <div class="modal-content">
    <h3 id="modalTitulo">Estado seleccionado</h3>
    <p id="modalTexto"></p>

    <div class="modal-buttons">
      <button id="btnAceptar">Aceptar</button>
      <button id="btnDetalle">Ver detalle</button>
    </div>
  </div>
</div>

<!-- Tooltip para los Estados -->
<div id="tooltipEstado" class="tooltip"></div>

<script> 
function abrirDashboard(estadoId) {
  window.location.href = `matricula.html?estado=${estadoId}`
}
</script>

<body>

<!-- HEADER -->
<header class="header">
  <div class="header-left">
    <img src="img/Logo.png" alt="Logo" class="logo">
    <h1 class="titulo">Dashboard Matrículas - EBDI</h1>
  </div>
</header>

<!-- CONTENIDO -->
<main class="main">
  <div id="map-container">
    <object id="mapa" type="image/svg+xml" data="MapaIndex.svg"></object>
  </div>

  <div id="contador"></div>
  <div id="ebdiContainer"></div>
  <div id="pagination"></div>
</main>

<!-- FOOTER -->
<footer class="footer">
  <p>Sistema Crecimiento y Desarrollo EBDI © 2026 | Subdirección de Capacitación y Servicios Educativos</p>
</footer>

<!-- Scripts -->
<script src="js/app.js"></script>

</body>
</html>
